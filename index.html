<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Al Jaddaf Project Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: dashboard home with section icons; each section and table opens on its own page. Palette: corporate slate neutrals with a deep navy accent; the logo keeps its own colours. */
:root {
  --bg: #F4F6F9; --surface: #FFFFFF; --surface-2: #F7F9FC; --ink: #172233; --ink-2: #536174;
  --line: #E1E6ED; --line-strong: #B6C0CE;
  --brand: #E7EDF5; --brand-ink: #1B3352; --brand-text: #1F4E79; --brand-soft: #EEF3F9; --accent: #1F4E79; --accent-ink: #FFFFFF;
  --navy: #EEF2F7; --navy-ink: #172233; --navy-soft: #F3F6FA; --navy-text: #1F4E79;
  --hl: #FFF5D6; --hl-ink: #4A3B00;
  --good: #167A45; --good-bg: #DDF2E5; --warn: #8A5A00; --warn-bg: #FBEFD0; --bad: #B42318; --bad-bg: #FBE2DF;
  --c-plan: #BAC6D6; --c-act: #1F4E79; --c-grid: #E8EDF3;
  --rag-red: #E5302A; --rag-orange: #F39C12; --rag-yellow: #F2CF1D; --rag-green: #1FA463;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 14px rgba(16,24,40,.06);
  --f-display: "Lexend", "Segoe UI", Arial, sans-serif;
  --f-body: "Noto Sans", "Segoe UI", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1520; --surface: #161E2B; --surface-2: #1B2433; --ink: #E6EBF2; --ink-2: #9CA9BA;
    --line: #263043; --line-strong: #3C4961;
    --brand: #1E2A3D; --brand-ink: #E6EBF2; --brand-text: #93B8E3; --brand-soft: #1A2436; --accent: #7BA9DE; --accent-ink: #0D1420;
    --navy: #1C2638; --navy-ink: #E6EBF2; --navy-soft: #1A2232; --navy-text: #A9C4E6;
    --hl: #39331A; --hl-ink: #F3E3A2;
    --good: #5BD08F; --good-bg: #14321F; --warn: #F0BE5A; --warn-bg: #3A2C0D; --bad: #FF8A80; --bad-bg: #3D1715;
    --c-plan: #3E4C63; --c-act: #8DB4E2; --c-grid: #232D3F;
    --shadow: 0 1px 2px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1520; --surface: #161E2B; --surface-2: #1B2433; --ink: #E6EBF2; --ink-2: #9CA9BA;
  --line: #263043; --line-strong: #3C4961;
  --brand: #1E2A3D; --brand-ink: #E6EBF2; --brand-text: #93B8E3; --brand-soft: #1A2436; --accent: #7BA9DE; --accent-ink: #0D1420;
  --navy: #1C2638; --navy-ink: #E6EBF2; --navy-soft: #1A2232; --navy-text: #A9C4E6;
  --hl: #39331A; --hl-ink: #F3E3A2;
  --good: #5BD08F; --good-bg: #14321F; --warn: #F0BE5A; --warn-bg: #3A2C0D; --bad: #FF8A80; --bad-bg: #3D1715;
  --c-plan: #3E4C63; --c-act: #8DB4E2; --c-grid: #232D3F;
  --shadow: 0 1px 2px rgba(0,0,0,.45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--navy-text); outline-offset: 2px; }
.num, td.r, .kpi b { font-variant-numeric: tabular-nums; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100vh; }
.rail[hidden], .picker[hidden], #b-formulas[hidden] { display: none !important; }
/* Ground Up logo: taupe on the light theme, beige on the dark theme */
.brand { padding: 4px 2px 2px; }
.brand .logo { height: 46px; width: auto; display: block; max-width: 100%; }
.brand .logo-d { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .brand .logo-l { display: none; } :root:not([data-theme="light"]) .brand .logo-d { display: block; } }
:root[data-theme="dark"] .brand .logo-l { display: none; } :root[data-theme="dark"] .brand .logo-d { display: block; }
@media (max-width: 640px) { .brand .logo { height: 34px; } }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
.crumbs .btn.back { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.crumbs ol { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 14px; color: var(--ink-2); }
.crumbs li + li::before { content: "›"; margin-right: 6px; color: var(--line-strong); }
.crumbs li button { border: 0; background: none; padding: 0; color: var(--brand-text); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.crumbs li[aria-current="page"] { color: var(--ink); font-weight: 600; }
.presenting .crumbs { display: none; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; background: var(--surface);
        border-right: 1px solid var(--line); padding-left: env(safe-area-inset-left, 0px); display: flex; flex-direction: column; }
.rail-head { background: var(--brand); color: var(--brand-ink); padding: 16px 16px 14px; }
.rail-head b { display: block; font: 700 18px/1.1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
.rail-head span { font-size: 13px; opacity: .9; }
.rail-tools { padding: 12px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.search { width: 100%; padding: 9px 11px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); }
.views { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.views button { padding: 8px 4px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface);
                font: 600 13px var(--f-display); letter-spacing: .04em; text-transform: uppercase; }
.views button:hover { background: var(--brand-soft); }
.views button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: var(--navy-ink); }
.group h3 { margin: 0; padding: 12px 16px 6px; font: 700 12px var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--brand-text); }
.group button { display: grid; grid-template-columns: 28px 1fr; gap: 4px; width: 100%; text-align: left; border: 0; background: none;
                padding: 8px 16px 8px 12px; border-left: 4px solid transparent; font-size: 14.5px; line-height: 1.3; }
.group button span:first-child { font: 500 12px/1.6 var(--f-mono); color: var(--ink-2); }
.group button:hover { background: var(--surface-2); }
.group button[aria-current="true"] { background: var(--hl); color: var(--hl-ink); border-left-color: var(--brand); font-weight: 600; }
.group button[aria-current="true"] span:first-child { color: var(--hl-ink); }
.rail-empty { padding: 14px 16px; color: var(--ink-2); font-size: 14px; }

.main { min-width: 0; padding-block: 20px 72px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1320px; margin: 0 auto; display: grid; gap: 18px; }

.band { background: var(--brand); color: var(--brand-ink); border-radius: 6px; padding: 10px 14px; display: flex; justify-content: space-between;
        gap: 12px; font: 700 14px var(--f-display); letter-spacing: .08em; text-transform: uppercase; }
.proj { display: grid; gap: 6px; }
.proj h1 { margin: 0; font: 700 clamp(22px, 2.6vw, 30px)/1.15 var(--f-display); text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--ink-2); font-size: 14px; }
.meta b { color: var(--ink); font-weight: 600; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line-strong);
       background: var(--surface); font-weight: 600; font-size: 14px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--navy); border-color: var(--navy); color: var(--navy-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.go { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.status { margin-left: auto; color: var(--ink-2); font-size: 13px; }
.picker { display: none; }

/* ---------- view header ---------- */
.vh { display: grid; gap: 8px; }
.eyebrow { font: 700 13px var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--brand-text); }
.vh h2 { margin: 0; font: 700 clamp(24px, 3vw, 32px)/1.1 var(--f-display); text-wrap: balance; }
.vh-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; gap: 6px; align-items: baseline; padding: 5px 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13.5px; }
.chip b { font-weight: 600; font-variant-numeric: tabular-nums; }
.chip.good { background: var(--good-bg); border-color: transparent; color: var(--good); }
.chip.warn { background: var(--warn-bg); border-color: transparent; color: var(--warn); }
.chip.bad { background: var(--bad-bg); border-color: transparent; color: var(--bad); }
.stepper { display: flex; gap: 6px; }

/* ---------- cards & tables ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); min-width: 0; }
.card-h { background: var(--brand); color: var(--brand-ink); padding: 9px 14px; border-radius: 8px 8px 0 0; display: flex; justify-content: space-between;
          align-items: center; gap: 10px; font: 700 14px var(--f-display); letter-spacing: .07em; text-transform: uppercase; }
.card-h button { background: transparent; border: 1px solid rgba(255,255,255,.55); color: var(--brand-ink); border-radius: 5px; padding: 2px 9px;
                 font: 600 12px var(--f-display); letter-spacing: .05em; }
.card-b { padding: 0; }
.scroll { overflow-x: auto; }
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14.5px; }
.tbl th, .tbl td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; text-align: left; }
.tbl thead th { position: sticky; top: 0; background: var(--navy); color: var(--navy-ink); font: 600 13.5px/1.25 var(--f-display);
                letter-spacing: .05em; text-transform: uppercase; vertical-align: bottom; white-space: nowrap; }
.tbl thead th.wr { white-space: normal; min-width: 90px; }
.tbl tbody tr:nth-child(even) > * { background: var(--surface-2); }
.tbl tbody tr:last-child > * { border-bottom: 0; }
.tbl td.r, .tbl th.r { text-align: right; }
.tbl td.c, .tbl th.c { text-align: center; }
.tbl td.n { width: 44px; color: var(--ink-2); font: 500 13px var(--f-mono); }
.tbl .total > * { background: var(--hl) !important; color: var(--hl-ink); font-weight: 600; }
.tbl td.long { min-width: 260px; max-width: 520px; }
.tbl td.nw, .tbl td[data-calc] { white-space: nowrap; }
.kv th[scope="row"] { width: 58%; font-weight: 500; color: var(--ink-2); }
.kv td { font-weight: 600; }
.kv td.kvv { font-variant-numeric: tabular-nums; width: 42%; }
.kv tr.grp > th { background: var(--navy-soft) !important; color: var(--navy-text); font: 700 13px var(--f-display); letter-spacing: .07em;
                   text-transform: uppercase; padding-block: 7px; }
.unit { color: var(--ink-2); font-weight: 400; font-size: 12.5px; }
.nil { color: var(--line-strong); }
.tone-good { color: var(--good); } .tone-warn { color: var(--warn); } .tone-bad { color: var(--bad); }
.empty { color: var(--ink-2); text-align: center !important; padding: 26px !important; }

.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font: 600 12.5px var(--f-display); letter-spacing: .05em; text-transform: uppercase;
        background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.good { background: var(--good-bg); color: var(--good); } .pill.warn { background: var(--warn-bg); color: var(--warn); } .pill.bad { background: var(--bad-bg); color: var(--bad); }

.fx { display: inline-flex; align-items: center; justify-content: center; margin-left: 8px; padding: 0 6px; height: 20px; border-radius: 4px;
      border: 1px solid var(--line-strong); background: var(--surface); color: var(--brand-text); font: italic 600 12px var(--f-mono); vertical-align: 1px; }
.fx:hover { background: var(--brand-soft); }
th .fx { border-color: rgba(255,255,255,.6); background: transparent; color: var(--navy-ink); height: 18px; }
.calc-note { padding: 10px 14px; color: var(--ink-2); font-size: 13px; border-top: 1px solid var(--line); }

/* editing */
.in { width: 100%; min-width: 110px; padding: 7px 9px; border: 1px solid var(--line-strong); border-radius: 5px; background: var(--surface); }
.in:focus { border-color: var(--navy-text); outline: none; box-shadow: 0 0 0 3px var(--navy-soft); }
textarea.in { min-width: 220px; resize: vertical; line-height: 1.4; }
.in.numin { text-align: right; max-width: 170px; }
.editing td[data-calc] { background: var(--brand-soft) !important; }
.rowact { white-space: nowrap; width: 1%; }
.rowact button { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 5px; width: 30px; height: 30px; margin-left: 3px; }
.rowact button:hover { background: var(--bad-bg); color: var(--bad); }
.add { margin: 12px 14px; }
.editbar { position: sticky; bottom: env(safe-area-inset-bottom, 0px); z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
           padding: 12px 16px; border-radius: 8px; background: var(--navy); color: var(--navy-ink); box-shadow: var(--shadow); }
.editbar p { margin: 0; flex: 1; min-width: 200px; font-size: 14px; }
.editbar .btn { border-color: rgba(255,255,255,.5); background: transparent; color: var(--navy-ink); }
.editbar .btn.go { background: var(--brand); border-color: var(--brand); }

/* overview */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 4px; box-shadow: var(--shadow); }
.kpi span { font: 700 12.5px var(--f-display); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); }
.kpi b { font: 700 28px/1.1 var(--f-display); }
.kpi small { color: var(--ink-2); font-size: 13px; }
.kpi.good b { color: var(--good); } .kpi.warn b { color: var(--warn); } .kpi.bad b { color: var(--bad); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 12px; }
.tile { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 0; display: flex; flex-direction: column;
        box-shadow: var(--shadow); transition: transform .12s, border-color .12s; }
.tile:hover { transform: translateY(-2px); border-color: var(--brand); }
.tile .tt { background: var(--brand); color: var(--brand-ink); border-radius: 8px 8px 0 0; padding: 8px 12px; display: flex; justify-content: space-between; gap: 8px;
            font: 700 13.5px var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
.tile .tt i { font: 500 12px var(--f-mono); font-style: normal; opacity: .85; }
.tile .ts { padding: 12px; font-size: 14.5px; flex: 1; }
.tile .tg { padding: 0 12px 12px; font-size: 13px; color: var(--brand-text); font-weight: 600; }

/* section icons */
.secs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 12px; }
.sec { display: grid; grid-template-rows: auto 1fr auto; gap: 12px; text-align: left; padding: 16px; border: 1px solid var(--line); border-radius: 12px;
       background: var(--surface); box-shadow: var(--shadow); transition: transform .15s, border-color .15s, box-shadow .15s; }
.sec .ico { width: 56px; height: 56px; border-radius: 14px; background: var(--brand-soft); color: var(--brand-text); display: grid; place-items: center; transition: background .15s, color .15s; }
.sec svg, .h-ico, .group h3 svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sec .ico svg { width: 30px; height: 30px; }
.sec-t { display: grid; gap: 3px; }
.sec .k { font: 700 12px var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.sec b { font: 700 18px/1.2 var(--f-display); }
.sec small { font-size: 13.5px; color: var(--ink-2); }
.sec-f { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 10px; }
.sec-f .go { margin-left: auto; color: var(--brand-text); font-size: 16px; transition: transform .15s; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line-strong); flex: none; }
.dot.good { background: var(--rag-green); } .dot.warn { background: var(--rag-orange); } .dot.bad { background: var(--rag-red); }
.sec:hover, .sec:focus-visible { transform: translateY(-3px); border-color: var(--brand); box-shadow: 0 8px 24px rgba(0,0,0,.12); }
.sec:hover .ico, .sec:focus-visible .ico, .sec[aria-current="true"] .ico { background: var(--brand); color: var(--brand-ink); }
.sec:hover .go { transform: translateX(3px); }
.sec[aria-current="true"] { border-color: var(--brand); outline: 2px solid var(--brand); outline-offset: -1px; }
.secs.compact { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.sec.compact { grid-template-rows: none; grid-template-columns: 40px 1fr; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; box-shadow: none; }
.sec.compact .ico { width: 40px; height: 40px; border-radius: 10px; }
.sec.compact .ico svg { width: 22px; height: 22px; }
.sec.compact b { font-size: 14.5px; }
.sec.compact .k { font-size: 11px; }
.sec-h { display: flex; align-items: center; gap: 12px; }
.h-ico { width: 36px; height: 36px; padding: 6px; border-radius: 10px; background: var(--brand); color: var(--brand-ink); flex: none; }
.group h3 button { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; padding: 0; text-align: left;
                   font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; }
.group h3 button:hover span { text-decoration: underline; }
.group h3 svg { width: 18px; height: 18px; flex: none; }
.group h3 button[aria-current="true"] { color: var(--ink); }

.sheetgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); gap: 14px; align-items: start; }
.sheetgrid .wide { grid-column: 1 / -1; }

/* performance */
.perf { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; padding: 14px; }
.perf section { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.perf h4 { margin: 0; background: var(--navy); color: var(--navy-ink); padding: 8px 12px; font: 700 13.5px var(--f-display); letter-spacing: .07em; text-transform: uppercase; }
.perf .msg { padding: 14px; background: var(--hl); color: var(--hl-ink); font-weight: 500; }
.rag { display: grid; gap: 6px; padding: 12px 14px; }
.rag div { display: grid; grid-template-columns: 18px 70px 1fr; gap: 8px; align-items: center; font-size: 14px; color: var(--ink-2); padding: 3px 6px; border-radius: 6px; }
.rag div.on { background: var(--surface-2); color: var(--ink); font-weight: 600; outline: 1.5px solid var(--line-strong); }
.rag i { width: 16px; height: 16px; border-radius: 50%; display: block; opacity: .35; }
.rag div.on i { opacity: 1; box-shadow: 0 0 0 3px var(--surface); }

/* progress bars */
.bars { display: grid; gap: 14px; padding: 16px; border-top: 1px solid var(--line); }
.bar-row { display: grid; grid-template-columns: minmax(130px, 220px) 1fr; gap: 12px; align-items: center; }
.bar-row > span { font-weight: 600; font-size: 14px; }
.bar { display: grid; gap: 4px; }
.bar div { position: relative; height: 12px; border-radius: 6px; background: var(--surface-2); outline: 1px solid var(--line); overflow: hidden; }
.bar div i { position: absolute; inset: 0 auto 0 0; border-radius: 6px; }
.bar small { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.mock { display: grid; grid-template-columns: 2fr 1fr 1fr; border-top: 1px solid var(--line); }
.mock > div { padding: 12px 14px; display: grid; gap: 4px; border-right: 1px solid var(--line); }
.mock > div:last-child { border-right: 0; }

<script>
"use strict";
/* ================= helpers ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const num = v => (v === "" || v == null || isNaN(+v)) ? null : +v;
const toD = iso => (iso && /^\d{4}-\d{2}-\d{2}$/.test(iso)) ? new Date(iso + "T00:00:00Z") : null;
const fmtD = iso => { const d = toD(iso); return d ? `${d.getUTCDate()}-${MON[d.getUTCMonth()]}-${String(d.getUTCFullYear()).slice(2)}` : (iso ? esc(iso) : ""); };
const fmtM = ym => { const m = /^(\d{4})-(\d{2})$/.exec(ym || ""); return m ? `${MON[+m[2] - 1]}-${m[1].slice(2)}` : esc(ym); };
const dd = (a, b) => { const x = toD(a), y = toD(b); return x && y ? Math.round((x - y) / 864e5) : null; };
const latest = (...a) => a.filter(toD).sort().pop() || null;
const fN = (v, dp = 0) => v == null ? "" : v.toLocaleString("en-US", { minimumFractionDigits: dp, maximumFractionDigits: dp });
const fP = (v, dp = 2) => v == null ? "" : fN(v, dp) + "%";
const fDays = v => v == null ? "" : v < 0 ? `(${fN(-v)})` : fN(v);
const div = (a, b) => (num(a) == null || !num(b)) ? null : num(a) / num(b);
const clone = o => JSON.parse(JSON.stringify(o));
const getP = (o, p) => p.split(".").reduce((a, k) => a == null ? a : a[k], o);
function setP(o, p, v) { const ks = p.split("."); let a = o; ks.slice(0, -1).forEach((k, i) => { if (a[k] == null) a[k] = /^\d+$/.test(ks[i + 1]) ? [] : {}; a = a[k]; }); a[ks[ks.length - 1]] = v; }
const NIL = '<span class="nil">–</span>';
function fmtVal(t, v, dp) {
  if (v == null || v === "") return NIL;
  switch (t) {
    case "num": return fN(num(v), dp ?? 0);
    case "money": return fN(num(v), 2);
    case "pct": return fP(num(v), dp ?? 2);
    case "days": return fDays(num(v));
    case "date": return fmtD(v);
    case "month": return fmtM(v);
    case "long": return esc(v).replace(/\n/g, "<br>");
    default: return esc(v);
  }
}
const isRight = t => ["num", "money", "pct", "days"].includes(t);
const RAG = { red: "Red", orange: "Orange", yellow: "Yellow", green: "Green" };

/* ================= formulas (single-value) ================= */
const P = D => D.progress || { rows: [] };
function overall(D, key) {
  let s = 0, any = false;
  (P(D).rows || []).forEach(r => { const v = num(r[key]), w = num(r.weight); if (v != null && w != null) { any = true; s += v * w / 100; } });
  return any ? s : null;
}
const weightText = D => (P(D).rows || []).map(r => `${fN(num(r.weight), 1)}% ${r.name || ""}`).join(" + ");
const ovSub = (D, key) => (P(D).rows || []).map(r => `${fP(num(r[key]))} × ${fN(num(r.weight), 1)}%`).join(" + ");
function delayMonths(D) { const s = FX["forecast.slippage"].f(D); return s == null ? null : -s / 30.44; }

const FX = {
  "stats.far": { label: "Floor Area Ratio", expr: "Gross Floor Area ÷ Plot Area", t: "num", dp: 2,
    f: D => div(D.stats.gfa, D.stats.plot), sub: D => `${fN(num(D.stats.gfa), 2)} ÷ ${fN(num(D.stats.plot), 2)}` },
  "stats.eff": { label: "Efficiency", expr: "Net Sellable Area ÷ Built Up Area × 100", t: "pct", dp: 1,
    f: D => { const x = div(D.stats.nsa, D.stats.bua); return x == null ? null : x * 100; }, sub: D => `${fN(num(D.stats.nsa), 2)} ÷ ${fN(num(D.stats.bua), 2)} × 100` },
  "contract.duration": { label: "Time for Completion (days)", expr: "Completion Date − Commencement Date + 1", t: "days",
    f: D => { const x = dd(D.contract.completion, D.contract.commencement); return x == null ? null : x + 1; },
    sub: D => `${fmtD(D.contract.completion)} − ${fmtD(D.contract.commencement)} + 1` },
  "contract.remaining": { label: "Time Remaining (days)", expr: "MAX(Completion Date, Revised Completion Date) − Reporting Date", t: "days",
    f: D => dd(latest(D.contract.completion, D.contract.revisedCompletion), D.contract.reportDate),
    sub: D => `MAX(${fmtD(D.contract.completion)}, ${fmtD(D.contract.revisedCompletion)}) − ${fmtD(D.contract.reportDate)}` },
  "contract.timeUsed": { label: "Time Used (%)", expr: "(Reporting Date − Commencement Date) ÷ (MAX(Completion Date, Revised Completion Date) − Commencement Date) × 100", t: "pct", dp: 1,
    f: D => { const a = dd(D.contract.reportDate, D.contract.commencement), b = dd(latest(D.contract.completion, D.contract.revisedCompletion), D.contract.commencement); return a == null || !b ? null : Math.max(0, a / b * 100); },
    sub: D => `(${fmtD(D.contract.reportDate)} − ${fmtD(D.contract.commencement)}) ÷ (MAX(${fmtD(D.contract.completion)}, ${fmtD(D.contract.revisedCompletion)}) − ${fmtD(D.contract.commencement)}) × 100`,
    note: "Compare with overall progress: work done should keep pace with time used." },
  "forecast.position": { label: "Current Progress Position (days)", expr: "Forecast Completion (Project Team) − MAX(Completion Date, Revised Completion Date)", t: "days",
    f: D => dd(D.forecast.forecastTeam, latest(D.contract.completion, D.contract.revisedCompletion)),
    sub: D => `${fmtD(D.forecast.forecastTeam)} − MAX(${fmtD(D.contract.completion)}, ${fmtD(D.contract.revisedCompletion)})`,
    tone: v => v > 0 ? "bad" : "", note: "0 means on track for the revised completion date; a positive number is days late." },
  "forecast.eotClaim": { label: "EOT Claim (days) by Contractor", expr: "Revised Completion Date − Completion Date", t: "days",
    f: D => dd(D.contract.revisedCompletion, D.contract.completion), sub: D => `${fmtD(D.contract.revisedCompletion)} − ${fmtD(D.contract.completion)}` },
  "forecast.handover": { label: "Hand-over Date (from BCC Date)", expr: "= Forecast Completion Date (Project Team)", t: "date",
    f: D => D.forecast.forecastTeam || null, sub: D => fmtD(D.forecast.forecastTeam) },
  "forecast.slippage": { label: "Total Slippage to Orig. Baseline (days)", expr: "Completion Date − Forecast Completion Date (Project Team)", t: "days",
    f: D => dd(D.contract.completion, D.forecast.forecastTeam), sub: D => `${fmtD(D.contract.completion)} − ${fmtD(D.forecast.forecastTeam)}`,
    tone: v => v < 0 ? "bad" : "", note: "A number in brackets is a delay against the original completion date." },
  "info.spi": { label: "SPI (Schedule Performance Index)", expr: "Overall Cum. Actual % ÷ Overall Cum. Planned %", t: "num", dp: 2,
    f: D => div(overall(D, "cumAct"), overall(D, "cumPlan")), sub: D => `${fP(overall(D, "cumAct"))} ÷ ${fP(overall(D, "cumPlan"))}`,
    tone: v => spiStatus(v).tone, note: "1.00 or more: on schedule · 0.90–0.99: behind schedule · below 0.90: critically behind schedule." },
  "performance.rag": { label: "Programme status", expr: "Delay (months) = − Total Slippage ÷ 30.44 → Red > 6 · Orange 4–6 · Yellow 1–4 · Green < 1", t: "text",
    f: D => { const m = delayMonths(D); return m == null ? null : m > 6 ? "red" : m >= 4 ? "orange" : m >= 1 ? "yellow" : "green"; },
    sub: D => { const s = FX["forecast.slippage"].f(D); return s == null ? "" : `− (${fDays(s)}) ÷ 30.44 = ${fN(delayMonths(D), 1)} months`; },
    show: v => v ? `<span class="pill ${v === "green" ? "good" : v === "red" ? "bad" : "warn"}">${RAG[v]}</span>` : NIL },
  "payment.unpaid": { label: "Certified, not yet paid (AED)", expr: "Certified Value (with variation) − Amount Paid", t: "money",
    f: D => { const a = num(D.payment.certWithVar), b = num(D.payment.paid); return a == null || b == null ? null : a - b; },
    sub: D => `${fN(num(D.payment.certWithVar), 2)} − ${fN(num(D.payment.paid), 2)}` },
  "payment.paidPct": { label: "Paid of certified", expr: "Amount Paid ÷ Certified Value (with variation) × 100", t: "pct", dp: 1,

function fbtn(key, label) { return `<button type="button" class="fx" data-f="${esc(key)}" aria-label="Show formula for ${esc(label)}">ƒ</button>`; }
function calcCell(key, D) { const c = FX[key]; const v = c.f(D); const tone = c.tone ? c.tone(v) : "";
  return `<span class="${tone ? "tone-" + tone : ""}">${c.show ? c.show(v) : fmtVal(c.t, v, c.dp)}</span>${fbtn("k:" + key, c.label)}`; }
function rowCalcCell(tid, ck, r, i, rows, D) { const c = RX[tid + "." + ck]; const v = c.f(r, i, rows, D); const tone = c.tone ? c.tone(v) : "";
  return `<span class="${tone ? "tone-" + tone : ""}">${c.show ? c.show(v) : fmtVal(c.t, v, c.dp)}</span>${v != null ? fbtn(`r:${tid}:${i}:${ck}`, c.label) : ""}`; }
function inputFor(path, f, v) {
  const id = "f-" + path.replace(/\./g, "-"), al = esc(f.label || f.k);
  if (f.t === "long") return `<textarea class="in" id="${id}" data-p="${path}" data-t="long" rows="3" aria-label="${al}">${esc(v)}</textarea>`;
  if (f.t === "select") return `<select class="in" id="${id}" data-p="${path}" data-t="text" aria-label="${al}"><option value="">–</option>${f.opts.map(o => `<option${o === v ? " selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  if (f.t === "date") return `<input class="in" type="date" id="${id}" data-p="${path}" data-t="date" value="${esc(v || "")}" aria-label="${al}">`;
  if (f.t === "month") return `<input class="in" type="month" id="${id}" data-p="${path}" data-t="text" value="${esc(v || "")}" aria-label="${al}">`;
  if (isRight(f.t)) return `<input class="in numin" type="number" step="any" inputmode="decimal" id="${id}" data-p="${path}" data-t="num" value="${v == null ? "" : esc(v)}" aria-label="${al}${f.t === "pct" ? " (%)" : ""}">`;
  return `<input class="in" type="text" id="${id}" data-p="${path}" data-t="text" value="${esc(v || "")}" aria-label="${al}">`;
}
const showField = (f, v) => f.show ? f.show(v) : fmtVal(f.t, v, f.dp);

function kvBody(t, D, edit) {
  const o = getP(D, t.path) || {};

    if (f.group) return `<tr class="grp"><th colspan="2">${esc(f.group)}</th></tr>`;
    if (f.calc) { const c = FX[f.calc]; return `<tr><th scope="row">${esc(c.label)}</th><td class="kvv" data-calc="k:${f.calc}">${calcCell(f.calc, D)}</td></tr>`; }
    const path = t.path + "." + f.k;

      <td class="kvv">${edit ? inputFor(path, f, o[f.k]) : showField(f, o[f.k])}</td></tr>`;
  }).join("")}</tbody></table></div>`;
}

/* ================= charts ================= */
const SVGW = 960, SVGH = 420;
function axisChart(o) {
  const L = 62, R = o.right ? 62 : 22, T = 58, B = 70, pw = SVGW - L - R, ph = SVGH - T - B, n = Math.max(1, o.labels.length), slot = pw / n;

  let s = `<svg viewBox="0 0 ${SVGW} ${SVGH}" role="img" aria-label="${esc(o.title)}"><text class="ttl" x="${L}" y="22">${esc(o.title)}</text>`;
  for (let v = o.left.min; v <= o.left.max + 1e-9; v += o.left.step) s += `<line x1="${L}" x2="${L + pw}" y1="${yl(v)}" y2="${yl(v)}" style="stroke:var(--c-grid)"/><text x="${L - 8}" y="${yl(v) + 4}" text-anchor="end" font-size="12">${o.left.fmt(v)}</text>`;
  s += `<line x1="${L}" x2="${L + pw}" y1="${T + ph}" y2="${T + ph}" style="stroke:var(--line-strong)"/>`;
  const bw = Math.min(14, slot * (o.bw || .32));
  o.bars.forEach((b, k) => b.data.forEach((v, i) => { if (v == null) return;
    const x = L + i * slot + slot / 2 + (k - (o.bars.length - 1) / 2) * (bw + 1.5) - bw / 2, y = yl(Math.max(o.left.min, Math.min(o.left.max, v)));
    s += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${(T + ph - y).toFixed(1)}" rx="1.5" style="fill:${b.color}"><title>${esc(b.name)} · ${o.labels[i]}: ${o.left.fmt(v, true)}</title></rect>`; }));
  if (o.right) {
    const yr = v => T + ph - (v - o.right.min) / (o.right.max - o.right.min) * ph;
    for (let v = o.right.min; v <= o.right.max + 1e-9; v += o.right.step) s += `<text x="${L + pw + 8}" y="${yr(v) + 4}" font-size="12">${o.right.fmt(v)}</text>`;
    o.lines.forEach(ln => { const pts = ln.data.map((v, i) => v == null ? null : [L + i * slot + slot / 2, yr(v)]).filter(Boolean);
      if (pts.length) s += `<polyline points="${pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ")}" style="fill:none;stroke:${ln.color};stroke-width:2.5"/>`;
      const lp = pts[pts.length - 1]; if (lp) s += `<circle cx="${lp[0]}" cy="${lp[1]}" r="4.5" style="fill:${ln.color};stroke:var(--surface);stroke-width:2"/>`;
      ln.data.forEach((v, i) => { if (v != null) s += `<circle cx="${L + i * slot + slot / 2}" cy="${yr(v)}" r="7" style="fill:transparent"><title>${esc(ln.name)} · ${o.labels[i]}: ${fP(v)}</title></circle>`; }); });
    s += `<text x="${SVGW - 10}" y="${T + ph / 2}" transform="rotate(90 ${SVGW - 10} ${T + ph / 2})" text-anchor="middle" font-size="12" font-weight="600">${esc(o.right.title)}</text>`;
  }
  const every = n > 30 ? 2 : 1;
  o.labels.forEach((m, i) => { if (i % every) return; const x = L + i * slot + slot / 2 + 4, y = T + ph + 8; s += `<text x="${x}" y="${y}" transform="rotate(-60 ${x} ${y})" text-anchor="end" font-size="11">${m}</text>`; });
  s += `<text x="16" y="${T + ph / 2}" transform="rotate(-90 16 ${T + ph / 2})" text-anchor="middle" font-size="12" font-weight="600">${esc(o.left.title)}</text>`;
  const items = o.bars.map(b => ({ ...b, kind: "bar" })).concat((o.lines || []).map(l => ({ ...l, kind: "line" })));
  let lx = L; items.forEach(it => { s += it.kind === "bar" ? `<rect x="${lx}" y="34" width="14" height="10" rx="2" style="fill:${it.color}"/>` : `<line x1="${lx}" x2="${lx + 18}" y1="39" y2="39" style="stroke:${it.color};stroke-width:2.5"/>`;
    s += `<text x="${lx + 22}" y="43.5" font-size="12.5">${esc(it.name)}</text>`; lx += 34 + it.name.length * 6.6; });
  return s + "</svg>";
}
function scurveSVG(rows) {
  const labels = rows.map(r => fmtM(r.m));
  const mp = rows.map((r, i) => RX["scurve.mPlan"].f(r, i, rows)), ma = rows.map((r, i) => RX["scurve.mAct"].f(r, i, rows));
  const maxM = Math.max(4, ...mp.filter(v => v != null), ...ma.filter(v => v != null));
  const top = Math.ceil(maxM);
  return axisChart({ title: "Project S-Curve (based on cost)", labels,
    left: { min: 0, max: top, step: top > 8 ? 2 : 1, title: "Monthly %", fmt: (v, t) => t ? fP(v) : v + "%" },
    right: { min: 0, max: 100, step: 20, title: "Cumulative %", fmt: v => v + "%" },
    bars: [{ name: "Planned this period", data: mp, color: "var(--c-plan)" }, { name: "Actual this period", data: ma, color: "var(--c-act)" }],
    lines: [{ name: "Cum. planned", data: rows.map(r => num(r.plan)), color: "var(--c-plan)" }, { name: "Cum. actual", data: rows.map(r => num(r.act)), color: "var(--c-act)" }] });
}
function manpowerSVG(rows) {

  const top = Math.max(100, Math.ceil(Math.max(0, ...vals) / 100) * 100);
  return axisChart({ title: "Total manpower histogram (planned vs actual)", labels: rows.map(r => fmtM(r.m)), bw: .36,
    left: { min: 0, max: top, step: top > 600 ? 200 : 100, title: "Manpower on site", fmt: v => fN(v) },
    bars: [{ name: "Planned", data: rows.map(r => num(r.plan)), color: "var(--c-plan)" }, { name: "Actual", data: rows.map(r => num(r.act)), color: "var(--c-act)" }] });
}

    k("HSE manhours", man ? fN(num(man.total)) : "–", `${fat ? fN(num(fat.total) || 0) : "–"} fatalities to date`, fat && num(fat.total) ? "bad" : "good", "hse"),

}

/* Contract timeline: commencement to the latest completion date, elapsed vs remaining,
   with the extension beyond the original completion shown separately. */
function timelineChart(D) {
  const c = D.contract, f = D.forecast || {};
  const start = toD(c.commencement), orig = toD(c.completion), rep = toD(c.reportDate);
  const endIso = latest(c.completion, c.revisedCompletion, f.forecastTeam), end = toD(endIso);
  if (!start || !end || end <= start) return "";
  const W = 960, L = 20, R = 20, pw = W - L - R, y = 64, h = 30;
  const x = d => L + Math.max(0, Math.min(1, (d - start) / (end - start))) * pw;
  const xr = rep ? x(rep) : null, xo = orig ? x(orig) : null;
  let s = `<svg viewBox="0 0 ${W} 172" role="img" aria-label="Project timeline from ${fmtD(c.commencement)} to ${fmtD(endIso)}">`;
  for (let yr = start.getUTCFullYear(); yr <= end.getUTCFullYear(); yr++) {
    const d = new Date(Date.UTC(yr, 0, 1)); if (d <= start || d >= end) continue;
    s += `<line x1="${x(d)}" x2="${x(d)}" y1="${y + h + 4}" y2="${y + h + 52}" style="stroke:var(--c-grid)"/><text x="${x(d) + 4}" y="${y + h + 50}" font-size="14">${yr}</text>`;
  }
  s += `<rect x="${L}" y="${y}" width="${pw}" height="${h}" rx="5" style="fill:var(--c-plan)"/>`;
  if (xo != null && xo < L + pw) s += `<rect x="${xo}" y="${y}" width="${L + pw - xo}" height="${h}" rx="0" style="fill:var(--rag-orange);opacity:.55"/>`;
  if (xr != null) s += `<rect x="${L}" y="${y}" width="${Math.max(0, xr - L)}" height="${h}" rx="5" style="fill:var(--c-act)"/>`;
  if (xo != null) s += `<line x1="${xo}" x2="${xo}" y1="${y - 6}" y2="${y + h + 8}" style="stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:4 3"/>
    <text x="${xo}" y="${y + h + 26}" text-anchor="middle" font-size="16">Original completion <tspan font-weight="700">${fmtD(c.completion)}</tspan></text>`;
  if (xr != null) s += `<line x1="${xr}" x2="${xr}" y1="${y - 10}" y2="${y + h + 4}" style="stroke:var(--ink);stroke-width:2.5"/>
    <text x="${xr > W / 2 ? xr - 8 : xr + 8}" y="${y - 16}" text-anchor="${xr > W / 2 ? "end" : "start"}" font-size="17" font-weight="700" style="fill:var(--ink)">Reporting date ${fmtD(c.reportDate)}</text>`;
  s += `<text x="${L}" y="${y + h + 26}" font-size="16">Commencement <tspan font-weight="700">${fmtD(c.commencement)}</tspan></text>
    <text x="${L + pw}" y="${y - 16}" text-anchor="end" font-size="16">${endIso === c.revisedCompletion ? "Revised completion" : "Completion"} <tspan font-weight="700">${fmtD(endIso)}</tspan></text></svg>`;
  const used = FX["contract.timeUsed"].f(D), work = overall(D, "cumAct");
  return `<div class="timeline"><div class="chart">${s}</div>
    <div class="tl-legend"><span><i style="background:var(--c-act)"></i>Time elapsed</span><span><i style="background:var(--c-plan)"></i>Time remaining</span><span><i style="background:var(--rag-orange);opacity:.55"></i>Extension beyond original completion</span></div>
    <div class="chips tl-chips">${chip("Time used", fP(used, 1) || "–")}${chip("Work done", fP(work) || "–", work != null && used != null && work < used ? "warn" : "good")}${chip("Time remaining", (fmtCalcPlain("contract.remaining", D) || "–") + " days")}</div></div>`;
}

/* SPI schedule status, judged on the SPI as displayed (2 decimals) */
function spiStatus(v) {
  if (v == null || !isFinite(v)) return { label: "", tone: "" };
  const r = Math.round(v * 100) / 100;
  if (r > 1) return { label: "Ahead of schedule", tone: "good" };
  if (r >= 1) return { label: "On schedule", tone: "good" };
  if (r >= 0.9) return { label: "Behind schedule", tone: "warn" };
  return { label: "Critically behind schedule", tone: "bad" };
}

/* Time remaining tile with a time-used bar (commencement to latest completion) */
function timeKpi(D) {
  const used = FX["contract.timeUsed"].f(D), end = latest(D.contract.completion, D.contract.revisedCompletion);
  const pct = Math.max(0, Math.min(100, used || 0));
  return `<button type="button" class="kpi" data-open="contract" style="text-align:left;font:inherit;color:inherit"
      aria-label="Time remaining ${fmtCalcPlain("contract.remaining", D)} days to ${fmtD(end)}; ${fP(used, 1)} of contract time used">
    <span>Time remaining</span><b>${fmtCalcPlain("contract.remaining", D) || "–"} days</b>
    <div class="tbar" aria-hidden="true"><i style="width:${pct.toFixed(2)}%"></i></div>
    <small>${fP(used, 0) || "–"} of time used · to ${fmtD(end)}</small></button>`;
}

/* Overall progress tile with a planned-vs-actual bar chart (0-100% scale) */
function progressKpi(D, v) {
  const plan = overall(D, "cumPlan"), act = overall(D, "cumAct");
  const w = x => Math.max(0, Math.min(100, x || 0)).toFixed(2) + "%";
  return `<button type="button" class="kpi kpi-chart ${v < 0 ? "bad" : "good"}" data-open="progstats" style="text-align:left;font:inherit;color:inherit"
      aria-label="Overall progress: actual ${fP(act)}, planned ${fP(plan)}, variance ${fP(v)}">
    <span>Overall progress</span><b>${fP(act) || "–"}</b>
    <div class="pbars" aria-hidden="true">
      <div class="pbar"><em>Plan</em><div class="trk"><i style="width:${w(plan)};background:var(--c-plan)"></i></div><var>${fP(plan, 1)}</var></div>
      <div class="pbar"><em>Actual</em><div class="trk"><i style="width:${w(act)};background:var(--c-act)"></i></div><var>${fP(act, 1)}</var></div>
    </div>
    <small>Variance ${fP(v)}</small></button>`;
}

  document.title = t ? `${t.title} · Al Jaddaf Project Dashboard` : secOf(st.route) ? `${SECTIONS[secOf(st.route)]} · Al Jaddaf Project Dashboard` : "Al Jaddaf Project Dashboard";

function editMsg(t) {

async function save(next, note) {
  if (!db) return toast("Saving needs the published page on claude.ai.");
  const btns = document.querySelectorAll('[data-act="save"]'); btns.forEach(b => { b.disabled = true; b.textContent = "Saving…"; });

}

  const m = /^([A-Za-z]{3,})[\s\-\/.']*(\d{2,4})$/.exec(s);

  if (t.type === "list" || t.type === "series") return [{ name: sheetName(t), kind: "list", path: t.path, cols: t.cols.filter(c => c.k) }];
  if (t.type === "performance") return [{ name: sheetName(t), kind: "kv", path: "performance", fields: [{ k: "programme", label: "Programme comment" }, { k: "budget", label: "Budget comment" }, { k: "budgetRag", label: "Budget status (red, orange or green)" }] }];
  if (t.type === "progress") return [{ name: "Progress Statistics", kind: "list", path: "progress.rows", cols: [{ k: "name", label: "Discipline" }, { k: "weight", label: "Weight %", t: "pct" }, { k: "cumPlan", label: "Cum. Plan. %", t: "pct" }, { k: "cumAct", label: "Cum. Act. %", t: "pct" }, { k: "planWk", label: "Plan % this week", t: "pct" }, { k: "actWk", label: "Act % this week", t: "pct" }] },
    { name: "Progress Notes", kind: "kv", path: "progress", fields: [{ k: "mockup.label", label: "Sectional milestone" }, { k: "mockup.planned", label: "Milestone planned" }, { k: "mockup.actual", label: "Milestone forecast / actual" }, { k: "remarks", label: "Progress remarks" }] }];

}
const IO = () => TABLES.flatMap(ioFor);
function exportVal(f, v) { if (f.t === "date") return isoSerial(v) ?? ""; if (f.t === "month") return isoSerial((v || "") + "-01") ?? ""; return v == null ? "" : v; }

function buildTemplate(XLSX, D) {
  const wb = XLSX.utils.book_new();
  const readme = [["Al Jaddaf Project Dashboard: editable data"], [""], ["Each sheet is one table on the dashboard. Change the values, keep the column headings and sheet names, then upload this file on the dashboard with Upload Excel."],
    ["Calculated cells (Time Remaining, variances, SPI, overall progress and others) are not in this file. The dashboard works them out after upload."],
    ["Dates: type them as Excel dates. Percentages: type 57 for 57%."], ["Photos are not part of this file. Add them on the dashboard under Edit tables."]];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(readme), "README");
  IO().forEach(io => {
    let aoa, dateCols = [];
    if (io.kind === "kv") { const o = getP(D, io.path) || {}; aoa = [["Field", "Value"]].concat(io.fields.map((f, i) => { if (f.t === "date") dateCols.push(i + 1); return [f.label, exportVal(f, getP(o, f.k))]; })); }
    else { const rows = getP(D, io.path) || []; io.cols.forEach((c, j) => { if (c.t === "date" || c.t === "month") dateCols.push(j); }); aoa = [io.cols.map(c => c.label + (c.t === "pct" && !/%/.test(c.label) ? " (%)" : ""))].concat(rows.map(r => io.cols.map(c => exportVal(c, r[c.k])))); }
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    if (io.kind === "kv") dateCols.forEach(r => { const c = ws[XLSX.utils.encode_cell({ r, c: 1 })]; if (c && typeof c.v === "number") c.z = "dd-mmm-yy"; });
    else for (let r = 1; r < aoa.length; r++) dateCols.forEach(j => { const c = ws[XLSX.utils.encode_cell({ r, c: j })]; if (c && typeof c.v === "number") c.z = io.cols[j].t === "month" ? "mmm-yy" : "dd-mmm-yy"; });

function parseTemplateBook(XLSX, wb, base) {
  const D = normalize(clone(base || {})); const warn = []; let used = 0;
  IO().forEach(io => {
    const ws = wb.Sheets[io.name]; if (!ws) { warn.push(`Sheet "${io.name}" was missing, so that table kept its current figures.`); return; }
    const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: "" }); used++;
    if (io.kind === "kv") { const o = clone(getP(D, io.path) || {});
      io.fields.forEach(f => { const row = aoa.find(r => String(r[0]).trim().toLowerCase() === f.label.toLowerCase()); if (row) setP(o, f.k, importVal(f, row[1])); });
      if (io.path === "progress") Object.assign(D.progress, { mockup: o.mockup || {}, remarks: o.remarks || "" }); else setP(D, io.path, o); }
    else { const head = (aoa[0] || []).map(h => String(h).replace(/\s*\(%\)\s*$/, "").trim().toLowerCase());
      const idx = io.cols.map(c => head.indexOf(c.label.toLowerCase()));
      const rows = aoa.slice(1).filter(r => r.some(x => x !== "" && x != null)).map(r => { const o = {}; io.cols.forEach((c, j) => { if (idx[j] >= 0) o[c.k] = importVal(c, r[idx[j]]); }); return o; });
      setP(D, io.path, rows); }
  });
  return { D, warn, kind: `Dashboard data template (${used} sheets read)` };
}

/* ---- upload flow ---- */
$("b-upload").onclick = () => { $("f-excel").value = ""; $("f-excel").click(); };
$("f-excel").addEventListener("change", async e => {
  const file = e.target.files[0]; if (!file) return;
  toast("Reading " + file.name + "…");
  let XLSX; try { XLSX = await loadXLSX(); } catch (err) { return toast("The Excel reader could not load. Check your connection and try again."); }
  let res;
  try {
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array", cellFormula: true });
    if (wb.SheetNames.some(n => /dashboard/i.test(n)) && !wb.Sheets["README"]) res = parseDashboardBook(XLSX, wb, st.D);
    else if (wb.Sheets["Project Information"] || wb.Sheets["README"]) res = parseTemplateBook(XLSX, wb, st.D);
    else return modal("This file doesn't match", `<p style="margin:0">Upload either the monthly dashboard workbook (with a sheet named "1. Dashboard") or the template from Download Excel.</p><p style="margin:0;color:var(--ink-2)">Sheets in ${esc(file.name)}: ${esc(wb.SheetNames.join(", "))}</p>`, [{ label: "OK", primary: true }]);
  } catch (err) { return modal("The file could not be read", `<p style="margin:0">${esc(file.name)} isn't a readable Excel workbook. Save it as .xlsx in Excel and upload it again.</p>`, [{ label: "OK", primary: true }]); }
  const old = st.D || normalize({}), nd = res.D;
  const changes = TABLES.filter(t => t.type !== "photos").map(t => {
    const paths = t.type === "progress" ? ["progress"] : [t.path];
    const ch = paths.some(p => JSON.stringify(getP(old, p)) !== JSON.stringify(getP(nd, p)));
    const n = Array.isArray(getP(nd, t.path)) ? ` (${getP(nd, t.path).length} rows)` : "";
    return ch ? `<li><b>${esc(t.title)}</b>${n}</li>` : "";
  }).filter(Boolean);
  modal("Review the upload", `<p style="margin:0"><b>${esc(file.name)}</b> · ${esc(res.kind)}</p>
    <p style="margin:0">Reporting date: ${fmtD(old.contract.reportDate) || "–"} → <b>${fmtD(nd.contract.reportDate) || "–"}</b> · overall actual ${fP(overall(old, "cumAct")) || "–"} → <b>${fP(overall(nd, "cumAct")) || "–"}</b></p>
    ${changes.length ? `<p style="margin:0">These tables will change:</p><ul>${changes.join("")}</ul>` : `<p style="margin:0">The figures are the same as the saved dashboard.</p>`}
    ${res.warn.length ? `<div class="notice">${res.warn.map(esc).join("<br>")}</div>` : ""}
    <p style="margin:0;color:var(--ink-2);font-size:14px">Photos stay as they are. The current figures are kept as the previous save, so you can restore them.</p>`,
    [{ label: "Cancel" }, { label: changes.length ? "Apply and save" : "Save anyway", primary: true, run: () => save(nd, "uploaded " + file.name) }]);
});
$("b-download").onclick = async () => {
  if (!downloads || !st.D) return;
  let XLSX; try { XLSX = await loadXLSX(); } catch (e) { return toast("The Excel writer could not load. Check your connection and try again."); }
  const out = XLSX.write(buildTemplate(XLSX, st.D), { type: "array", bookType: "xlsx" });
  try { await downloads.save({ filename: `Project Dashboard data - ${stripTags(fmtD(st.D.contract.reportDate)) || "template"}.xlsx`, data: new Blob([out]) }); toast("Excel file saved."); }
  catch (err) { if (err && err.code !== "declined") toast("The file could not be saved here."); }
};

/* ================= presenting ================= */
/* Self-playing presentation: dashboard first, then every table in order.
   Each page is scaled to fit the screen so nothing needs scrolling. */
const SLIDES = () => ["overview"].concat(TABLES.map(t => t.id));
const pres = { playing: false, ms: 10000, elapsed: 0, last: 0, raf: 0 };
function slideIdx() { const i = SLIDES().indexOf(st.route); return i < 0 ? 0 : i; }
function presGo(i) { const s = SLIDES(); pres.elapsed = 0; pres.last = 0; go(s[Math.max(0, Math.min(s.length - 1, i))]); }
function presStep(d) { presGo(slideIdx() + d); }
function presTick() {
  if (!st.presenting || !pres.playing) return;
  const now = performance.now();
  if (pres.last) pres.elapsed += now - pres.last;
  pres.last = now;
  $("p-bar").style.width = Math.min(100, pres.elapsed / pres.ms * 100) + "%";
  if (pres.elapsed >= pres.ms) {
    if (slideIdx() < SLIDES().length - 1) presStep(1);
    else { setPlaying(false); toast("End of the presentation. Select Replay to start again."); }
  }
}
function setPlaying(on) {
  pres.playing = on; pres.last = 0;
  const b = $("p-play"); b.textContent = on ? "❚❚ Pause" : "▶ Play"; b.setAttribute("aria-pressed", String(on));
  clearInterval(pres.raf); pres.raf = on ? setInterval(presTick, 100) : 0;
}
function fitPresent() {
  const v = $("view"); v.style.zoom = "";
  if (!st.presenting) return;
  const bar = document.querySelector(".present-bar");
  const avail = window.innerHeight - bar.getBoundingClientRect().bottom - 20;
  const fits = z => { v.style.zoom = z === 1 ? "" : String(z); return v.getBoundingClientRect().height <= avail + 1; };
  if (fits(1)) return;
  // scaling reflows the text (lines get longer, so fewer lines), so search for the largest size that fits
  let lo = 0.35, hi = 1;
  for (let i = 0; i < 8; i++) { const mid = (lo + hi) / 2; if (fits(mid)) lo = mid; else hi = mid; }
  fits(lo);
}
function startPresent() {
  if (st.editing) return toast("Save or cancel your changes before presenting.");
  st.presenting = true; pres.ms = +$("p-speed").value * 1000; presGo(0); render(); setPlaying(true);
  try { const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
}
function stopPresent() { setPlaying(false); st.presenting = false; $("view").style.zoom = ""; try { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); } catch (e) {} render(); }
$("b-present").onclick = startPresent; $("p-exit").onclick = stopPresent;
$("p-prev").onclick = () => presStep(-1); $("p-next").onclick = () => presStep(1);
$("p-play").onclick = () => setPlaying(!pres.playing);
$("p-replay").onclick = () => { presGo(0); setPlaying(true); };
$("p-speed").onchange = e => { pres.ms = +e.target.value * 1000; };
window.addEventListener("resize", () => { if (st.presenting) fitPresent(); });
$("view").addEventListener("load", () => { if (st.presenting) fitPresent(); }, true);
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && st.presenting) { st.presenting = false; render(); } });

/* ================= GitHub Pages mode =================
   Outside claude.ai the page reads data.json from its own GitHub repository.
   Viewers only read. An editor signs in with their own GitHub key (fine-grained token,
   Contents: Read and write on this one repository); the key stays in that browser only
   and every save is a commit to data.json, with the prior figures kept in data-previous.json. */
const GH = { owner: "waleedtammamwrwr-netizen", repo: "al-jaddaf-dashboard", branch: "main" };
const isGH = !(window.claude && typeof window.claude.use === "function") && (/\.github\.io$/i.test(location.hostname) || /[?&]ghmode\b/.test(location.search));
const TOKEN_KEY = "al-jaddaf-dashboard-github-key";
let ghToken = null, ghLogin = null;
try { ghToken = localStorage.getItem(TOKEN_KEY); } catch (e) {}
const ghPreview = {};
function photoURL(p) { return p.src ? (ghPreview[p.src] || p.src) : "/_blob/" + p.id; }
async function ghApi(path, opts = {}) {
  const r = await fetch(path.startsWith("https://") ? path : `https://api.github.com/repos/${GH.owner}/${GH.repo}/${path}`,
    Object.assign({}, opts, { headers: Object.assign({ Accept: "application/vnd.github+json" }, ghToken ? { Authorization: "Bearer " + ghToken } : {}, opts.headers || {}) }));
  if (!r.ok) { const e = new Error("GitHub " + r.status); e.status = r.status; e.code = r.status === 401 || r.status === 403 || r.status === 404 && opts.method === "PUT" ? "invalid_argument" : "unavailable"; throw e; }
  return r.status === 204 ? null : r.json();
}
const utf8b64 = s => btoa(unescape(encodeURIComponent(s)));
const b64utf8 = s => decodeURIComponent(escape(atob(s.replace(/\s/g, ""))));
async function blobB64(blob) { const u = new Uint8Array(await blob.arrayBuffer()); let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
async function ghPut(path, b64, message) {
  let sha; try { sha = (await ghApi(`contents/${path}?ref=${GH.branch}`)).sha; } catch (e) { if (e.status !== 404) throw e; }
  return ghApi(`contents/${path}`, { method: "PUT", body: JSON.stringify(Object.assign({ message, content: b64, branch: GH.branch }, sha ? { sha } : {})) });
}
async function ghRead(file) {
  if (ghToken) { try { const r = await ghApi(`contents/${file}?ref=${GH.branch}`); return JSON.parse(b64utf8(r.content)); } catch (e) { if (e.status === 404) return null; if (e.status !== 401 && e.status !== 403) throw e; } }
  const r = await fetch(`${file}?t=${Date.now()}`, { cache: "no-store" }); if (r.status === 404) return null; if (!r.ok) throw new Error("load " + r.status); return r.json();
}
const ghDb = { doc: p => { const file = p === "dashboard/previous" ? "data-previous.json" : "data.json"; return {
  get: async () => { const d = await ghRead(file); return { exists: !!d, data: () => d }; },
  set: async body => { if (!ghToken) { const e = new Error("no key"); e.code = "invalid_argument"; throw e; } await ghPut(file, utf8b64(JSON.stringify(body, null, 1)), `Dashboard: ${body.meta && body.meta.note || "update"} (${file})`); },
  onSnapshot: (next, err) => { ghRead(file).then(d => next({ exists: !!d, data: () => d })).catch(e => err && err(e)); return () => {}; } }; } };
const ghAssets = { upload: async file => { const ext = ((file.name.match(/\.(jpe?g|png|webp)$/i) || [, "jpg"])[1]).toLowerCase().replace("jpeg", "jpg");
  const path = `photos/upload-${Date.now()}.${ext}`; await ghPut(path, await blobB64(file), "Dashboard: add site photo"); ghPreview[path] = URL.createObjectURL(file); return { id: null, src: path }; } };
const ghDownloads = { save: async ({ filename, data }) => { const a = document.createElement("a"); a.href = URL.createObjectURL(data instanceof Blob ? data : new Blob([data])); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); return { status: "saved" }; } };
const ghUser = { can: async () => !!ghToken, id: async () => ghLogin, profiles: async ids => Object.fromEntries([].concat(ids).map(i => [i, { name: i || "" }])) };
const ghUse = async n => ({ db: ghDb, user: ghUser, assets: ghToken ? ghAssets : null, downloads: ghDownloads })[n] || null;

async function ghCheckKey() {
  const repo = await ghApi("");
  if (!repo.permissions || !repo.permissions.push) { const e = new Error("read only"); e.code = "readonly"; throw e; }
  try { ghLogin = (await ghApi("https://api.github.com/user")).login; } catch (e) { ghLogin = null; }
}
function renderSignin() { const b = $("b-signin"); b.hidden = !isGH || st.editing; b.textContent = ghToken ? `Sign out${ghLogin ? " (" + ghLogin + ")" : ""}` : "Editor sign in"; }
$("b-signin").onclick = () => {
  if (ghToken) { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} ghToken = null; ghLogin = null; uid = null; st.canWrite = false; assets = null; render(); return toast("Signed out. This browser no longer holds your GitHub key."); }
  let val = "";
  modal("Editor sign in", `<p style="margin:0">Paste your GitHub key to edit and save this dashboard. Viewers don't need this.</p>
    <label for="f-ghkey" style="font-weight:600">GitHub key (fine-grained personal access token)</label>
    <input class="in" id="f-ghkey" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…">
    <p style="margin:0;color:var(--ink-2);font-size:14px">Create one on GitHub under Settings › Developer settings › Fine-grained tokens: choose only the <b>${esc(GH.repo)}</b> repository and give it <b>Contents: Read and write</b>. The key is kept in this browser only. It is never saved in the page or the repository.</p>`,
    [{ label: "Cancel" }, { label: "Sign in", primary: true, run: async () => {
      const prev = ghToken; ghToken = val.trim(); if (!ghToken) { ghToken = prev; return toast("Paste a key to sign in."); }
      try { await ghCheckKey(); } catch (e) { ghToken = prev; return toast(e.code === "readonly" ? "That key can read but not save to this repository. Give it Contents: Read and write." : "GitHub didn't accept that key. Check it and try again."); }
      try { localStorage.setItem(TOKEN_KEY, ghToken); } catch (e) {}
      uid = ghLogin; st.canWrite = true; assets = ghAssets; render(); toast(`Signed in${ghLogin ? " as " + ghLogin : ""}. Open a table and select Edit this table.`);
    } }]);
  const inp = $("f-ghkey"); inp.addEventListener("input", e => val = e.target.value); inp.focus();
};

/* ================= boot ================= */
buildNav();
st.route = location.hash.slice(1) || "overview";
render();
(async () => {
  const use = (window.claude && typeof window.claude.use === "function") ? n => window.claude.use(n) : isGH ? ghUse : null;
  if (!use) { st.load = "offline"; render(); return; }
  if (isGH && ghToken) { try { await ghCheckKey(); } catch (e) { ghToken = null; try { localStorage.removeItem(TOKEN_KEY); } catch (x) {} } }
  try { [db, user] = await Promise.all([use("db"), use("user")]); } catch (e) { db = null; }
  if (!db) { st.load = "nodb"; render(); return; }
  if (user) { try { st.canWrite = await user.can("data.write"); uid = await user.id(); } catch (e) {} }
  use("assets").then(a => { assets = a; if (st.editing) render(); }).catch(() => {});
  use("downloads").then(d => { downloads = d; render(); }).catch(() => {});
  db.doc("dashboard/previous").get().then(s => { st.hasPrev = s.exists; render(); }).catch(() => {});
  db.doc("dashboard/current").onSnapshot(snap => {
    if (!snap.exists) { if (!st.D) { st.load = "empty"; render(); } return; }
    const next = normalize(clone(snap.data()));
    if (st.editing) { if ((next.meta && next.meta.updatedAt) !== st.baseStamp) { st.remoteChanged = true; st.D = next; render(); } return; }
    st.D = next; st.load = "ready"; render();
  }, err => { st.load = st.D ? "ready" : "error"; render(); });
})();
</script>
